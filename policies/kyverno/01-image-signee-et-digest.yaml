# Empêche l'exécution de toute image non signée ou référencée par un tag mutable.
# C'est le filet de sécurité qui rend la compromission d'un compte CI insuffisante
# pour déployer du code arbitraire en production.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: image-signee-et-digest
  annotations:
    policies.kyverno.io/description: >-
      Toute image doit provenir du registre interne, être référencée par digest
      et porter une signature Cosign valide émise par la chaîne CI de l'syfFerdinand.
spec:
  validationFailureAction: Enforce      # Audit en dev/recette pendant la montée en charge
  background: true
  rules:
    - name: registre-interne-uniquement
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [prod, recette] } }]
      validate:
        message: "Seul le registre interne registry.service-public.gouv.tg est autorisé."
        pattern:
          spec:
            containers:
              - image: "registry.service-public.gouv.tg/*"

    - name: digest-obligatoire
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [prod, recette] } }]
      validate:
        message: "L'image doit être référencée par digest (sha256), jamais par un tag mutable (ADR-0002)."
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"

    - name: signature-cosign-valide
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [prod, recette] } }]
      verifyImages:
        - imageReferences: ["registry.service-public.gouv.tg/*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/syfFerdinand/*"
                    issuer: "https://token.actions.githubusercontent.com"
          mutateDigest: false
          required: true
