# Traçabilité et FinOps : chaque ressource doit être rattachable à un service,
# une équipe et un commit.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: etiquetage-obligatoire }
spec:
  validationFailureAction: Enforce
  rules:
    - name: labels-requis
      match: { any: [{ resources: { kinds: [Pod, Service, Rollout] } }] }
      validate:
        message: "Étiquettes requises : app.kubernetes.io/name, app.kubernetes.io/version, equipe."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/version: "?*"
              equipe: "?*"
