# Hook Argo CD exécuté après chaque synchronisation.
# Il pose une annotation dans Grafana et publie les métriques DORA.
# Sans lui, la question « est-ce lié au déploiement de ce matin ? » reste sans réponse rapide.
apiVersion: batch/v1
kind: Job
metadata:
  name: annoter-deploiement
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: annotateur-deploiement
      containers:
        - name: annoter
          image: registry.service-public.gouv.tg/outils/annotateur:1.2.0
          command: ["/bin/sh", "/scripts/annoter-deploiement.sh"]
          env:
            - name: SERVICE
              value: app-usagers
            - name: ENV
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: GRAFANA_URL
              value: http://grafana.monitoring.svc
            - name: PUSHGATEWAY_URL
              value: http://prometheus-pushgateway.monitoring.svc:9091
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef: { name: observabilite-secrets, key: grafana-token }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: scripts
          configMap: { name: scripts-observabilite, defaultMode: 0755 }
