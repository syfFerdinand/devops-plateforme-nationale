apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus-rules-plateforme.yaml
  - prometheus-rules-dora.yaml
  - alertmanager-config.yaml
  - blackbox-probes.yaml
  - otel-collector.yaml
  - loki-alloy.yaml
configMapGenerator:
  - name: grafana-dashboards
    options:
      labels: { grafana_dashboard: "1" }    # découverte automatique par Grafana
    files:
      - grafana-dashboards/slo-service-usager.json
      - grafana-dashboards/dora-livraison.json
      - grafana-dashboards/chaine-cicd.json
  - name: scripts-observabilite
    files:
      - ../../scripts/annoter-deploiement.sh
