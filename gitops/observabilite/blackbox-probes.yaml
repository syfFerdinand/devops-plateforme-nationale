# Supervision synthétique : la plateforme est testée en continu de l'extérieur,
# sur les parcours réellement utilisés par les usagers.
# C'est ce qui permet de détecter une panne avant le premier signalement.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: parcours-usagers
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  jobName: parcours-usagers
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://www.service-public.gouv.tg/
        - https://www.service-public.gouv.tg/connexion
        - https://api.service-public.gouv.tg/healthz
        - https://api.service-public.gouv.tg/api/v1/services
      labels:
        env: prod
        criticite: haute
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        prober: http
        timeout: 8s
        http:
          valid_http_versions: [HTTP/1.1, HTTP/2.0]
          valid_status_codes: [200]
          method: GET
          fail_if_not_ssl: true
          preferred_ip_protocol: ip4
      # Parcours authentifié : vérifie que la chaîne d'authentification fonctionne,
      # pas seulement que la page d'accueil répond.
      parcours_authentifie:
        prober: http
        timeout: 15s
        http:
          method: GET
          bearer_token_file: /etc/probe/token
          valid_status_codes: [200]
          fail_if_body_not_matches_regexp:
            - '"statut"\s*:\s*"actif"'
