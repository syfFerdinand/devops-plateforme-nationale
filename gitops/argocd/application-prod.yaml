apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-usagers-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.slack: incidents
    notifications.argoproj.io/subscribe.on-sync-failed.slack: incidents
spec:
  project: plateforme-prod
  source:
    repoURL: https://github.com/organisation/platform-gitops.git
    targetRevision: main
    path: gitops/overlays/prod
  destination: { server: https://prod.k8s.plateforme.gouv, namespace: prod }
  syncPolicy:
    # En production : on corrige la dérive (selfHeal) mais on ne supprime jamais
    # automatiquement une ressource (prune: false). Une suppression est un acte volontaire.
    automated: { prune: false, selfHeal: true }
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
  revisionHistoryLimit: 20
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers: ["/spec/replicas"]    # laissé à l'HPA
