# Un namespace éphémère par Pull Request, détruit automatiquement à la fermeture.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: previews-pr, namespace: argocd }
spec:
  generators:
    - pullRequest:
        github: { owner: organisation, repo: app-usagers, labels: [preview] }
        requeueAfterSeconds: 60
  template:
    metadata: { name: 'preview-pr-{{number}}' }
    spec:
      project: plateforme-preview
      source:
        repoURL: https://github.com/organisation/platform-gitops.git
        targetRevision: main
        path: gitops/overlays/dev
        kustomize:
          namePrefix: 'pr-{{number}}-'
          images: ['registry.plateforme.gouv/app-usagers@{{head_sha}}']
      destination: { server: https://horsprod.k8s.plateforme.gouv, namespace: 'pr-{{number}}' }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
