# C'est ce fichier qui décide de promouvoir ou d'annuler un déploiement de production.
# Les seuils correspondent aux critères d'abandon de docs/08 §3.3.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: analyse-succes-latence
spec:
  args:
    - name: service-name
  metrics:
    # --- A1 : taux de succès -------------------------------------------------
    - name: taux-de-succes
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.995
      failureLimit: 1            # un seul dépassement suffit à annuler
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))

    # --- A2 : latence p95 ----------------------------------------------------
    - name: latence-p95
      interval: 1m
      count: 5
      successCondition: result[0] <= 0.5     # 500 ms
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])))

    # --- Erreurs applicatives ------------------------------------------------
    - name: erreurs-applicatives
      interval: 1m
      count: 5
      successCondition: result[0] <= 1
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(rate(application_errors_total{service="{{args.service-name}}",severity="critical"}[2m]))

    # --- A4 : tests de fumée sur la version canary ---------------------------
    - name: tests-de-fumee
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: registry.service-public.gouv.tg/outils/smoke-tests:1.4.0
                    args: ["http://{{args.service-name}}-canary.main.svc"]
