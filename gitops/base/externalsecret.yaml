# Le secret n'est JAMAIS dans Git : seule la référence au chemin Vault l'est (ADR-0004).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-usagers-secrets
  annotations:
    reloader.stakater.com/match: "true"   # redémarrage automatique à la rotation
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: app-usagers-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        # ENVIRONNEMENT est substitué par overlay : cloisonnement strict par environnement.
        key: secret/plateforme/ENVIRONNEMENT/app-usagers
